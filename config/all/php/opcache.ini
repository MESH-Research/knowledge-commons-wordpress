; OPcache: shared cache of compiled PHP bytecode for php-fpm.
;
; Installed into /usr/local/etc/php/conf.d/ by Dockerfile.php. Without it every
; php-fpm worker re-parses and re-compiles WordPress, BuddyPress and ~100
; plugins on every request, and reads the /content EFS packages over NFS to do
; so. With it, each file is compiled once per container into one shared segment.
;
; Watch it in production via GET /wp-json/idms/opcache (network admin or
; Profiles bearer token). If `restarts.oom` climbs or `cache_full` is true,
; raise memory_consumption; if `scripts.cached` approaches `scripts.max`,
; raise max_accelerated_files.

[opcache]
opcache.enable=1

; wp-cli runs in the cron container and exits after each job; a per-process
; CLI cache would cost memory and save nothing.
opcache.enable_cli=0

; Shared segment size in MiB. One segment per container, not per worker. The
; codebase (WordPress + BuddyPress + composer plugins + /content) is several
; hundred MiB of source; compiled opcodes are larger than source.
opcache.memory_consumption=1024
opcache.interned_strings_buffer=64

; Upper bound on cached files. PHP rounds up to the next prime (130987).
; The repository alone is ~1,100 PHP files; the composer tree and /content add
; tens of thousands more.
opcache.max_accelerated_files=100000

; The image is immutable, but /content (EFS) and local development mounts are
; not, so keep revalidation on and stat each file at most once a minute. This
; is one stat per file per minute, not per request.
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Plugins and PHPUnit read docblock annotations.
opcache.save_comments=1

; Trigger a restart (full recompile) only once a tenth of the segment is dead
; space from replaced files; the default of 5 restarts more often than needed
; on a codebase this size.
opcache.max_wasted_percentage=10

; The JIT is left at PHP's default (off). It is a separate decision with its
; own risk profile for WordPress and should be enabled on its own evidence.
