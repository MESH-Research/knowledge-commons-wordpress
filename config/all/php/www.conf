[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
user = www-data
group = www-data
pm = dynamic
pm.max_children = ${PM_MAX_CHILDREN}
pm.start_servers = ${PM_START_SERVERS}
pm.min_spare_servers = ${PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PM_MAX_REQUESTS}
ping.path = /ping
ping.response = pong

; --- Wall-clock limits and the slow log -------------------------------------
; max_execution_time in php.ini counts CPU time on Linux, so a worker blocked
; in a remote HTTP call, a database lock or a Redis read is never killed by PHP.
; This is the only wall-clock cap below nginx's fastcgi_read_timeout (300s in
; 00-hcommons.conf.template); it must stay lower so the worker is freed before
; nginx abandons the connection.
request_terminate_timeout = 150s

; Write a PHP backtrace to stderr (the container log) for every request that
; runs longer than this. The trace names the file and line the request is in,
; which is how slow paths get identified instead of inferred.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
request_slowlog_trace_depth = 30

; --- Access log with timing ------------------------------------------------
; The image's default access line records only "/index.php" for every
; WordPress request. Record the host and the request path (KC_REQUEST_PATH is
; set by nginx from $request_uri with the query string removed, so tokens in
; query strings never reach the log), the wall-clock duration in ms, the
; share of that time spent on CPU, and peak memory. Slow pages can then be
; found with a log query instead of a backtrace.
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %{HTTP_HOST}e%{KC_REQUEST_PATH}e\" %s %{mili}dms %C%% %{kilo}MkB"
