; Container pool settings that the docker-library php image used to supply in
; its own php-fpm.d/docker.conf and zz-docker.conf. The Alpine-packaged base
; image has no such file, and this www.conf replaces the one the image ships,
; so they have to live here. clear_env is the one that matters most: php-fpm
; defaults it to "yes", which strips DB_HOST, DB_NAME and every other
; environment variable from the workers and leaves WordPress with "Error
; establishing a database connection". Duplicating these on a base that still
; has docker.conf is harmless; the values are identical.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
user = www-data
group = www-data
pm = dynamic
pm.max_children = ${PM_MAX_CHILDREN}
pm.start_servers = ${PM_START_SERVERS}
pm.min_spare_servers = ${PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PM_MAX_REQUESTS}
ping.path = /ping
ping.response = pong

; Pass the container environment through to PHP workers (see header).
clear_env = no

; Send worker output and the access log to the container's stderr.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
